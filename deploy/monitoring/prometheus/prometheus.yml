# Prometheus : collecte des métriques toutes les 15 s et évaluation des alertes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Serveur Hetzner : CPU, mémoire, disque, réseau
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: serveur-hetzner

  # Caddy : requêtes, codes de réponse et durées par domaine (prod / préprod)
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  # Sondes HTTPS de bout en bout, comme un vrai visiteur :
  # DNS -> certificat TLS -> Caddy -> nginx -> backend -> MongoDB
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_site]
    static_configs:
      - targets: ["https://todo-ecommerce.duckdns.org/"]
        labels: { env: prod, check: frontend }
      - targets: ["https://todo-ecommerce.duckdns.org/api/health"]
        labels: { env: prod, check: api, __param_module: http_health }
      - targets: ["https://todo-ecommerce-preprod.duckdns.org/"]
        labels: { env: preprod, check: frontend }
      - targets: ["https://todo-ecommerce-preprod.duckdns.org/api/health"]
        labels: { env: preprod, check: api, __param_module: http_health }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
