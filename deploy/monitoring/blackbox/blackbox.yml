# Blackbox exporter : sondes HTTPS lancées par Prometheus.
modules:
  # Page d'accueil : HTTPS obligatoire, code 200 et page React servie
  http_site:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ["<title>"]

  # Santé de l'API : code 200 et MongoDB connecté
  http_health:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['"db":"up"']
