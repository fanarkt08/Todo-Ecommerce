# Reverse proxy HTTPS commun à la prod et à la préprod.
# Lancement sur le serveur : cd deploy/caddy && docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats et clés : à conserver, sinon Caddy redemande des certificats
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  caddy-data:
  caddy-config:
