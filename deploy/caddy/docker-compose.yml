# Reverse proxy HTTPS commun à la prod et à la préprod.
# Lancement sur le serveur : cd deploy/caddy && docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Dossier monté (et pas le fichier seul) : après un "git pull", Caddy voit le
      # nouveau Caddyfile et "caddy reload" l'applique sans coupure.
      - ./:/etc/caddy:ro
      # Certificats et clés : à conserver, sinon Caddy redemande des certificats
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  caddy-data:
  caddy-config:
