server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : résout "backend" à chaque requête
    # (l'IP du conteneur peut changer quand il redémarre).
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;

    # Le frontend appelle /api : nginx relaie vers le backend du même environnement.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router : les routes comme /login ou /tasks n'existent pas en fichiers,
    # on renvoie index.html pour que React les gère (sinon 404 au rafraîchissement).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
