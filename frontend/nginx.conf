server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas afficher la version de nginx dans les en-têtes et pages d'erreur (E28)
    server_tokens off;

    # Content-Security-Policy (E28) : le navigateur n'exécute que les scripts et styles
    # servis par ce domaine. Même si du HTML/JavaScript malveillant arrivait dans la page
    # (faille XSS), il ne pourrait ni s'exécuter en ligne, ni charger de script externe,
    # ni envoyer les données (le token) vers un autre site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # DNS interne de Docker : résout "backend" à chaque requête
    # (l'IP du conteneur peut changer quand il redémarre).
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;

    # Le frontend appelle /api : nginx relaie vers le backend du même environnement.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router : les routes comme /login ou /tasks n'existent pas en fichiers,
    # on renvoie index.html pour que React les gère (sinon 404 au rafraîchissement).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
