services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      # Compte admin créé au 1er démarrage (volume vide). Sans .env à la racine : pas d'auth (local).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
    ports:
      # 127.0.0.1 : jamais exposé sur Internet, accessible seulement depuis la machine (tunnel SSH)
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      # Local : backend/.env. Serveur : .env à la racine (prioritaire).
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/exam_practice_db}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
