# Journalisation de tous les services : logs JSON collectés par Docker,
# rotation à 10 Mo, 5 fichiers conservés par conteneur (50 Mo max).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    logging: *default-logging
    # Cache limité à 256 Mo (par défaut ~50 % de la RAM) : deux environnements
    # et la supervision partagent un serveur de 4 Go.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      # Compte admin créé au 1er démarrage (volume vide). Sans .env à la racine : pas d'auth (local).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
    ports:
      # 127.0.0.1 : jamais exposé sur Internet, accessible seulement depuis la machine (tunnel SSH)
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Images construites par la CI et publiées sur GHCR. Tag : "local" sur le poste,
    # APP_ENV (prod / preprod) sur le serveur, ou IMAGE_TAG=sha-<commit> pour un rollback.
    image: ghcr.io/fanarkt08/todo-ecommerce-backend:${IMAGE_TAG:-${APP_ENV:-local}}
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      # Local : backend/.env. Serveur : .env à la racine (prioritaire).
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/exam_practice_db}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    image: ghcr.io/fanarkt08/todo-ecommerce-frontend:${IMAGE_TAG:-${APP_ENV:-local}}
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
